# Unit tests on every pull request and every push to main. The VM tests stay ignored: they need KVM.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config cmake \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev \
            libfontconfig1-dev libfreetype-dev libx11-dev libxcb1-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --release
